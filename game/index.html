<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Take — Spot the Difference</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0d1017; color: #f4f1de; font-family: system-ui, 'Segoe UI', sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  header { width: min(1280px, 100vw); display: flex; align-items: center; gap: 14px; padding: 8px 16px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: 3px; color: #ffd23f; white-space: nowrap; }
  #scene-name { font-size: 16px; color: #a8dadc; white-space: nowrap; }
  .spacer { flex: 1; }
  button { background: #232946; color: #f4f1de; border: 1px solid #3d4468; border-radius: 8px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #2e3560; }
  #game { display: block; width: min(1280px, 100vw, calc((100vh - 52px) * 1.6)); aspect-ratio: 1280 / 800; background: #10131f; border-radius: 6px; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>DOUBLE TAKE</h1>
  <span id="scene-name">Coral Cove</span>
  <div class="spacer"></div>
  <button id="btn-hint" type="button">Hint (3)</button>
  <button id="btn-pause" type="button">Pause</button>
  <button id="btn-restart" type="button">Restart</button>
  <button id="btn-sound" type="button">Sound: On</button>
</header>
<canvas id="game" width="1280" height="800" aria-label="Double Take: two pictures side by side; click the differences between them"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
